<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Agent | Product comparison</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#1b2934;background:#edf2f5}*{box-sizing:border-box}body{margin:0;padding:18px}.shell{max-width:850px;margin:0 auto;border-radius:22px;background:#fff;box-shadow:0 14px 44px #142a3b13;overflow:hidden}.top{background:#172f40;color:white;padding:20px 25px;display:flex;align-items:center;gap:13px}.mark{width:38px;height:38px;border-radius:12px;background:#d4efe9;color:#135d54;display:grid;place-items:center;font-weight:900}.top h1{font-size:19px;margin:0}.top small{color:#c4d8e1}.body{padding:20px 24px;min-height:510px}.progress{display:flex;gap:6px;margin:0 0 19px}.progress span{height:5px;flex:1;background:#e3eaf0;border-radius:10px}.progress .on{background:#177e74}.thread{display:flex;flex-direction:column;gap:13px;max-height:610px;overflow-y:auto;padding:5px 3px 12px;scroll-behavior:smooth}.msg{max-width:88%;display:flex;gap:9px;align-items:flex-end}.msg.me{align-self:flex-end;flex-direction:row-reverse}.avatar{width:30px;height:30px;flex-shrink:0;border-radius:10px;background:#d9ebe8;color:#14685f;display:grid;place-items:center;font-size:15px}.msg.me .avatar{background:#dce8f3;color:#42627c}.bubble{background:#f0f4f7;padding:12px 15px;border-radius:15px 15px 15px 4px;line-height:1.52;font-size:14px;white-space:pre-line}.msg.me .bubble{background:#dff1ed;border-radius:15px 15px 4px 15px}.control{padding:17px 0 3px;border-top:1px solid #e5ebf0;margin-top:10px}.prompt{font-size:14px;font-weight:650;margin:0 0 12px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}.btn{border:1px solid #bdcbd3;border-radius:11px;background:#fff;padding:12px 14px;text-align:left;cursor:pointer;font:inherit;font-size:14px;color:#1d3442;min-height:45px}.btn:hover,.btn:focus-visible{outline:2px solid #167c73;outline-offset:1px}.btn.primary{background:#126d66;color:white;border-color:#126d66;text-align:center;font-weight:700}.btn:disabled{opacity:.55;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}.card{border:1px solid #d8e2e9;border-radius:14px;padding:12px;background:white}.card strong{font-size:15px}.card p{font-size:12px;line-height:1.5;color:#4c6574;margin:7px 0}.swatch{height:70px;border-radius:10px;margin-bottom:9px;display:grid;place-items:center}.swatch svg{max-width:110px;width:85%;height:60px}.price{font-size:13px;font-weight:650}.flag{border:1px solid #e5c990;background:#fff7e8;border-radius:12px;padding:13px 14px;font-size:13px;line-height:1.55;margin:10px 0}.summary{border:1px solid #c7ddd8;background:#eff8f5;border-radius:12px;padding:14px;font-size:14px;line-height:1.5}.muted{color:#607684;font-size:12px;line-height:1.55}.footer{padding:13px 24px;border-top:1px solid #e6ecf1;color:#647886;font-size:12px}.range{width:100%;accent-color:#126d66}.inline{display:flex;align-items:center;gap:12px}.inline>*{flex:1}.pill{font-size:11px;padding:4px 9px;border-radius:99px;background:#e5f3ef;color:#136c61;font-weight:700}.hidden{display:none}.error{background:#fff1ef;border:1px solid #e8b4ac;padding:15px;border-radius:10px}.typing{color:#6b8290;font-size:12px;padding:0 4px}.reply-form{display:flex;gap:9px;align-items:stretch}.reply-input{flex:1;min-width:0;border:1px solid #bdcbd3;border-radius:11px;padding:12px 13px;font:inherit;font-size:14px;resize:vertical;min-height:55px}.reply-form .btn{flex:0 0 auto}.helper{font-size:12px;color:#607684;margin:7px 0 0}@media(max-width:570px){body{padding:0}.shell{border-radius:0}.body{padding:16px}.cards{grid-template-columns:1fr}.card{display:grid;grid-template-columns:75px 1fr;gap:8px}.card .swatch{height:70px;grid-row:span 3}.msg{max-width:96%}}
</style></head><body><div class="shell"><header class="top"><div class="mark">✦</div><div><h1>AI Agent</h1><small id="meta">Interactive product comparison</small></div><span style="margin-left:auto" class="pill">Research activity</span></header><main class="body"><div class="progress" id="progress" aria-label="Activity progress"></div><section class="thread" id="thread" aria-live="polite" aria-label="Conversation"></section><section class="control" id="controls" aria-label="Your response"></section></main><footer class="footer">All products and brands are fictional. No real purchase or payment. </footer></div><script>
(()=>{'use strict';
const STUDY="study2",PRODUCTS=[{"id": "sola", "name": "Sola Flow", "color": "#e8ac88", "price": "$38", "a": "26 oz capacity", "b": "24-hour cold insulation", "c": "Easy-carry loop", "identity": "For everyday routines, wellness breaks, and mindful moments"}, {"id": "roam", "name": "Roam Peak", "color": "#7c9c8c", "price": "$38", "a": "26 oz capacity", "b": "24-hour cold insulation", "c": "Easy-carry loop", "identity": "For outdoor adventures, activity, and exploration"}, {"id": "linea", "name": "Linea Form", "color": "#a7a5c5", "price": "$38", "a": "26 oz capacity", "b": "24-hour cold insulation", "c": "Easy-carry loop", "identity": "For streamlined routines, design, and personal style"}],ART="<svg viewBox=\"0 0 140 80\" aria-hidden=\"true\"><rect x=\"59\" y=\"5\" width=\"22\" height=\"10\" rx=\"3\" fill=\"#294e5c\"/><rect x=\"49\" y=\"14\" width=\"42\" height=\"62\" rx=\"12\" fill=\"{color}\" stroke=\"#294e5c\" stroke-width=\"3\"/><path d=\"M55 34 H85\" stroke=\"#fff\" stroke-width=\"3\" opacity=\".6\"/></svg>";
const params=new URLSearchParams(location.search),role=params.get('role'),sponsor=params.get('sponsor'),frame=params.get('frame'),target=params.get('target')||PRODUCTS[0].id,pid=params.get('pid')||'';
const validRole=['collab','functional'].includes(role),validOther=STUDY==='study1'?['yes','no'].includes(sponsor):['identity','functional'].includes(frame),validTarget=PRODUCTS.some(x=>x.id===target);
const preview=params.get('preview')==='1',container=document.getElementById('thread'),controls=document.getElementById('controls'),bar=document.getElementById('progress'),meta=document.getElementById('meta');
const collaborative=role==='collab',identityFrame=frame==='identity';
let state={version:'6.0',study:STUDY,role,sponsor:STUDY==='study1'?sponsor:'',frame:STUDY==='study2'?frame:'',target,pid,initial:'',baselineFit:{},initialCertainty:'',answers:[],typedResponses:[],classifications:[],clarifications:[],elaboration:'',selected:'',accepted:false,startedAt:new Date().toISOString(),completedAt:'',turns:0};
const $=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};
function track(){state.turns++}function setStep(i){bar.replaceChildren();for(let j=0;j<5;j++){const s=$('span',j<=i?'on':'');bar.append(s)}}
function scroll(){container.scrollTop=container.scrollHeight}
function bubble(text,me=false){const wrap=$('div','msg'+(me?' me':'')),av=$('div','avatar',me?'●':'✦'),b=$('div','bubble',text);wrap.append(av,b);container.append(wrap);scroll();track()}
function panel(text,cls='summary'){container.append($('div',cls,text));scroll()}
function optionPrompt(prompt,opts,fn){controls.replaceChildren($('p','prompt',prompt));const grid=$('div','choices');opts.forEach(o=>{const b=$('button','btn',o);b.type='button';b.addEventListener('click',()=>{if(grid.dataset.answered)return;grid.dataset.answered='true';controls.replaceChildren();bubble(o,true);fn(o)});grid.append(b)});controls.append(grid)}
function button(label,fn){controls.replaceChildren();const b=$('button','btn primary',label);b.type='button';b.onclick=fn;controls.append(b)}
function cards(){const area=$('div','cards');PRODUCTS.forEach(p=>{const card=$('div','card'),sw=$('div','swatch');sw.style.background=p.color+'28';sw.innerHTML=ART.replaceAll('{color}',p.color);const title=$('strong','',p.name),details=$('p','',`${p.a} · ${p.b} · ${p.c}`),price=$('div','price',p.price);card.append(sw,title,details,price);area.append(card)});container.append(area);scroll()}
function recommendationText(p){return `${p.name} — ${p.a.toLowerCase()}, ${p.b.toLowerCase()}, ${p.c.toLowerCase()}; ${p.price}.`}
function start(){setStep(0);bubble(STUDY==='study1'?'Welcome. You are exploring three fictional headphone brands. Review the options before chatting with the AI Agent.':'Welcome. You are exploring three fictional reusable water-bottle brands. Review the options before chatting with the AI Agent.');cards();optionPrompt('Which product initially appeals to you most?',PRODUCTS.map(x=>x.name).concat(['No preference yet']),v=>{state.initial=v;confidence()})}
function confidence(){optionPrompt('How certain are you about that initial impression?',['Not at all certain','Somewhat certain','Very certain'],v=>{state.initialCertainty=v;if(STUDY==='study2')baselineFit(0);else intro()})}
function baselineFit(i){if(i===PRODUCTS.length){intro();return}const p=PRODUCTS[i];optionPrompt(`Before chatting with the AI Agent, how well does ${p.name} fit the kind of person you see yourself as?`,['1 — Not at all','2','3','4 — Moderately','5','6','7 — Extremely'],v=>{state.baselineFit[p.id]=parseInt(v,10);baselineFit(i+1)})}
const Q=STUDY==='study1'?[
{id:'priority',prompt:'What matters most to you in a pair of headphones?',labels:['Sound quality','Comfort','Battery life'],patterns:[[/sound|audio|music|bass|treble|clarity|noise cancel|anc|listening/i,0],[/comfort|comfortable|fit|wear|ear|lightweight|headache/i,1],[/battery|charge|power|last|hours|long flight/i,2]]},
{id:'context',prompt:'When or where do you imagine using them most?',labels:['Work or study','Travel or commuting','Relaxing at home'],patterns:[[/work|office|study|studying|school|class|desk|meeting|zoom/i,0],[/travel|commut|flight|plane|train|bus|airport|trip/i,1],[/home|relax|couch|sofa|evening|bed|house/i,2]]},
{id:'tradeoff',prompt:'How do you usually decide when no product is perfect?',labels:['Prioritize my top feature','Balance several features','Avoid major compromises'],patterns:[[/most important|top feature|one thing|priority|dealbreaker|must.have|non.negotiable/i,0],[/balance|middle|mix|overall|compromis(e|ing)|trade.off|weigh|combination/i,1],[/avoid|no compromise|not sacrifice|all.around|all of|everything|none of/i,2]]}
]:[
{id:'priority',prompt:'What matters most to you in a reusable water bottle?',labels:['Everyday convenience','Personal style','Durability'],patterns:[[/convenien|easy|clean|carry|leak|lid|size|drink|practical|fit.*bag/i,0],[/style|look|color|colour|design|aesthetic|cute|pretty|fashion|appearance/i,1],[/durab|last|strong|sturdy|quality|tough|material|steel|rugged/i,2]]},
{id:'context',prompt:'When or where would you use it most?',labels:['Work or campus','Fitness or outdoors','Everyday errands'],patterns:[[/work|office|campus|school|class|desk|study/i,0],[/gym|workout|fitness|exercise|hike|outdoor|walk|run|sport|yoga/i,1],[/errand|everyday|daily|car|shopping|around town|on.the.go|commut/i,2]]},
{id:'tradeoff',prompt:'How do you weigh different features when choosing a bottle?',labels:['Prioritize one key feature','Balance several features','Avoid compromises'],patterns:[[/most important|top feature|one thing|priority|dealbreaker|must.have|non.negotiable/i,0],[/balance|middle|mix|overall|compromis(e|ing)|trade.off|weigh|combination/i,1],[/avoid|no compromise|not sacrifice|all.around|all of|everything|none of/i,2]]}
];
function classify(raw,q){
 const hits=new Set();for(const [pattern,category] of q.patterns){if(pattern.test(raw))hits.add(category)}
 const values=[...hits];return {category:values.length===1?q.labels[values[0]]:values.length>1?'Multiple priorities':'No clear preference',ambiguous:values.length===0,matched:values.map(i=>q.labels[i])};
}
function typedPrompt(q,fn){
 controls.replaceChildren();const form=$('form','reply-form'),input=$('textarea','reply-input');input.rows=2;input.maxLength=400;input.placeholder='Type your answer here…';input.setAttribute('aria-label',q.prompt);input.required=true;
 const send=$('button','btn primary','Send');send.type='submit';form.append(input,send);form.addEventListener('submit',e=>{e.preventDefault();const value=input.value.trim();if(!value)return;controls.replaceChildren();bubble(value,true);fn(value)});controls.append(form,$('p','helper','A short answer is fine.'));input.focus();
}
function intro(){setStep(1);bubble(collaborative?'I can help you think through the options. Tell me a little about what matters to you, and we’ll compare the products together.':'I can help compare these products. I’ll ask three quick questions about your preferences.');ask(0)}
function ask(i){if(i>=Q.length){recommend();return}const q=Q[i];bubble(q.prompt);typedPrompt(q,raw=>{
 const parsed=classify(raw,q),entry={question:q.id,text:raw,initialCategory:parsed.category,matchedCategories:parsed.matched,finalCategory:parsed.category,clarified:false};
 state.typedResponses.push({question:q.id,text:raw});state.classifications.push(entry);
 if(parsed.ambiguous){
  bubble('Just to make sure I understand, which of these comes closest to what you mean?');
  optionPrompt('Choose the closest option:',[...q.labels,'None of these / no clear preference'],choice=>{
   entry.clarified=true;entry.finalCategory=choice=== 'None of these / no clear preference'?'No clear preference':choice;
   state.clarifications.push({question:q.id,reason:'no recognized category',selected:choice});state.answers.push(entry.finalCategory);acknowledge(i,entry.finalCategory);ask(i+1);
  });
 }else{state.answers.push(parsed.category);acknowledge(i,parsed.category);ask(i+1)}
})}
function acknowledge(i,category){if(i===Q.length-1)return;
 const neutral=category==='No clear preference'?'That’s fine; we can keep the comparison broad.':category==='Multiple priorities'?'It sounds like a few things matter to you. I’ll keep that in mind.':`Thanks — ${category.toLowerCase()} is useful context.`;
 bubble(collaborative?neutral:(category==='No clear preference'?'Understood. We can continue without a specific preference.':`Understood. ${category}.`));
}
function recommend(){setStep(3);const p=PRODUCTS.find(x=>x.id===target);bubble(collaborative?`Thanks for sharing how you'd use the product and what matters to you. One option to consider is ${p.name}. Let's look at its details and the alternatives before you decide.`:`One option to compare is ${p.name}. Here are its details alongside the other products.`);
if(STUDY==='study1')panel(sponsor==='yes'?`Advertising disclosure: ${p.name} is promoted through a paid relationship with this shopping service. This commercial relationship may influence the recommendation.`:'Advertising disclosure: No headphone manufacturer has paid this shopping service to promote a product in this recommendation.','flag');
else panel(identityFrame?`Brand information: ${p.identity}. This description reflects the brand's intended lifestyle positioning.`:`Brand information: ${p.name} offers ${p.a.toLowerCase()}, ${p.b.toLowerCase()}, and ${p.c.toLowerCase()}.`,'flag');
bubble(`Recommendation: ${recommendationText(p)}`);cards();
// Matched final conversational turn and identical choice control in both roles.
bubble(collaborative?'We can compare the recommended option with the others. Which comparison would you find most useful?' :'Which comparison would be most useful before choosing?' );optionPrompt('Choose a comparison dimension:',STUDY==='study1'?['Sound and comfort','Comfort and battery','Sound and battery']:['Daily convenience','Insulation and capacity','Design and use'],v=>{state.comparison=v;choice()})}
function choice(){setStep(4);bubble(collaborative?'You have the final say. Which option would you choose for yourself? It is also fine to choose none.':'Which option would you choose? You can also decide none is right for you.');optionPrompt('Which would you choose?',PRODUCTS.map(x=>x.name).concat(['I would choose none of these']),v=>{state.selected=v;state.accepted=PRODUCTS.find(x=>x.id===target).name===v;panel(`Your selection: ${v}. This is a research simulation. Nothing will be purchased.`);button('Confirm my selection',finish)})}
function finish(){state.completedAt=new Date().toISOString();state.completionCode='HAART-'+Math.random().toString(36).slice(2,10).toUpperCase();setStep(4);controls.replaceChildren();panel('Activity complete. Please continue to the survey questions.');const c=$('p','muted',`Completion code: ${state.completionCode}`);controls.append(c);const copy=$('button','btn','Copy completion code');copy.onclick=()=>navigator.clipboard?.writeText(state.completionCode);controls.append(copy);try{sessionStorage.setItem('haart-last-'+STUDY,JSON.stringify(state))}catch(e){}try{window.parent.postMessage({type:'haart-agent-complete',payload:state},'*')}catch(e){}if(preview){const out=$('details','');out.append($('summary','','Preview: show recorded responses'));const pre=$('pre','');pre.style.whiteSpace='pre-wrap';pre.textContent=JSON.stringify(state,null,2);out.append(pre);controls.append(out)}}
if(!validRole||!validOther||!validTarget){panel('This link needs a valid experimental assignment. Use the condition links in the README to test the agent.','error');return}
meta.textContent=STUDY==='study1'?'Headphone shopping · Research simulation':'Water-bottle shopping · Research simulation';start();
})();
</script></body></html>
