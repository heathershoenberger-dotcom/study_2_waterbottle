<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopping assistant | Research activity</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#1b2934;background:#edf2f5}*{box-sizing:border-box}body{margin:0;padding:18px}.shell{max-width:850px;margin:0 auto;border-radius:22px;background:#fff;box-shadow:0 14px 44px #142a3b13;overflow:hidden}.top{background:#172f40;color:white;padding:20px 25px;display:flex;align-items:center;gap:13px}.mark{width:38px;height:38px;border-radius:12px;background:#d4efe9;color:#135d54;display:grid;place-items:center;font-weight:900}.top h1{font-size:19px;margin:0}.top small{color:#c4d8e1}.body{padding:20px 24px;min-height:510px}.progress{display:flex;gap:6px;margin:0 0 19px}.progress span{height:5px;flex:1;background:#e3eaf0;border-radius:10px}.progress .on{background:#177e74}.thread{display:flex;flex-direction:column;gap:13px;max-height:610px;overflow-y:auto;padding:5px 3px 12px;scroll-behavior:smooth}.msg{max-width:88%;display:flex;gap:9px;align-items:flex-end}.msg.me{align-self:flex-end;flex-direction:row-reverse}.avatar{width:30px;height:30px;flex-shrink:0;border-radius:10px;background:#d9ebe8;color:#14685f;display:grid;place-items:center;font-size:15px}.msg.me .avatar{background:#dce8f3;color:#42627c}.bubble{background:#f0f4f7;padding:12px 15px;border-radius:15px 15px 15px 4px;line-height:1.52;font-size:14px;white-space:pre-line}.msg.me .bubble{background:#dff1ed;border-radius:15px 15px 4px 15px}.control{padding:17px 0 3px;border-top:1px solid #e5ebf0;margin-top:10px}.prompt{font-size:14px;font-weight:650;margin:0 0 12px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}.btn{border:1px solid #bdcbd3;border-radius:11px;background:#fff;padding:12px 14px;text-align:left;cursor:pointer;font:inherit;font-size:14px;color:#1d3442;min-height:45px}.btn:hover,.btn:focus-visible{outline:2px solid #167c73;outline-offset:1px}.btn.primary{background:#126d66;color:white;border-color:#126d66;text-align:center;font-weight:700}.btn:disabled{opacity:.55;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}.card{border:1px solid #d8e2e9;border-radius:14px;padding:12px;background:white}.card strong{font-size:15px}.card p{font-size:12px;line-height:1.5;color:#4c6574;margin:7px 0}.swatch{height:70px;border-radius:10px;margin-bottom:9px;display:grid;place-items:center}.swatch svg{max-width:110px;width:85%;height:60px}.price{font-size:13px;font-weight:650}.flag{border:1px solid #e5c990;background:#fff7e8;border-radius:12px;padding:13px 14px;font-size:13px;line-height:1.55;margin:10px 0}.summary{border:1px solid #c7ddd8;background:#eff8f5;border-radius:12px;padding:14px;font-size:14px;line-height:1.5}.muted{color:#607684;font-size:12px;line-height:1.55}.footer{padding:13px 24px;border-top:1px solid #e6ecf1;color:#647886;font-size:12px}.range{width:100%;accent-color:#126d66}.inline{display:flex;align-items:center;gap:12px}.inline>*{flex:1}.pill{font-size:11px;padding:4px 9px;border-radius:99px;background:#e5f3ef;color:#136c61;font-weight:700}.hidden{display:none}.error{background:#fff1ef;border:1px solid #e8b4ac;padding:15px;border-radius:10px}.typing{color:#6b8290;font-size:12px;padding:0 4px}@media(max-width:570px){body{padding:0}.shell{border-radius:0}.body{padding:16px}.cards{grid-template-columns:1fr}.card{display:grid;grid-template-columns:75px 1fr;gap:8px}.card .swatch{height:70px;grid-row:span 3}.msg{max-width:96%}}
</style></head><body><div class="shell"><header class="top"><div class="mark">✦</div><div><h1>Shopping Assistant</h1><small id="meta">Interactive product comparison</small></div><span style="margin-left:auto" class="pill">Research activity</span></header><main class="body"><div class="progress" id="progress" aria-label="Activity progress"></div><section class="thread" id="thread" aria-live="polite" aria-label="Conversation"></section><section class="control" id="controls" aria-label="Your response"></section></main><footer class="footer">All products and brands are fictional. No real purchase or payment. The assistant uses controlled scripted responses for research.</footer></div><script>
(()=>{'use strict';
const STUDY="study2",PRODUCTS=[{"id": "sola", "name": "Sola Flow", "color": "#e8ac88", "price": "$38", "a": "26 oz capacity", "b": "24-hour cold insulation", "c": "Easy-carry loop", "identity": "For everyday routines, wellness breaks, and mindful moments"}, {"id": "roam", "name": "Roam Peak", "color": "#7c9c8c", "price": "$38", "a": "26 oz capacity", "b": "24-hour cold insulation", "c": "Easy-carry loop", "identity": "For outdoor adventures, activity, and exploration"}, {"id": "linea", "name": "Linea Form", "color": "#a7a5c5", "price": "$38", "a": "26 oz capacity", "b": "24-hour cold insulation", "c": "Easy-carry loop", "identity": "For streamlined routines, design, and personal style"}],ART="<svg viewBox=\"0 0 140 80\" aria-hidden=\"true\"><rect x=\"59\" y=\"5\" width=\"22\" height=\"10\" rx=\"3\" fill=\"#294e5c\"/><rect x=\"49\" y=\"14\" width=\"42\" height=\"62\" rx=\"12\" fill=\"{color}\" stroke=\"#294e5c\" stroke-width=\"3\"/><path d=\"M55 34 H85\" stroke=\"#fff\" stroke-width=\"3\" opacity=\".6\"/></svg>";
const params=new URLSearchParams(location.search),role=params.get('role'),sponsor=params.get('sponsor'),frame=params.get('frame'),target=params.get('target')||PRODUCTS[0].id,pid=params.get('pid')||'';
const validRole=['collab','functional'].includes(role),validOther=STUDY==='study1'?['yes','no'].includes(sponsor):['identity','functional'].includes(frame),validTarget=PRODUCTS.some(x=>x.id===target);
const preview=params.get('preview')==='1',container=document.getElementById('thread'),controls=document.getElementById('controls'),bar=document.getElementById('progress'),meta=document.getElementById('meta');
const collaborative=role==='collab',identityFrame=frame==='identity';
let state={version:'4.0',study:STUDY,role,sponsor:STUDY==='study1'?sponsor:'',frame:STUDY==='study2'?frame:'',target,pid,initial:'',baselineFit:{},initialCertainty:'',answers:[],elaboration:'',selected:'',accepted:false,startedAt:new Date().toISOString(),completedAt:'',turns:0};
const $=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};
function track(){state.turns++}function setStep(i){bar.replaceChildren();for(let j=0;j<5;j++){const s=$('span',j<=i?'on':'');bar.append(s)}}
function scroll(){container.scrollTop=container.scrollHeight}
function bubble(text,me=false){const wrap=$('div','msg'+(me?' me':'')),av=$('div','avatar',me?'●':'✦'),b=$('div','bubble',text);wrap.append(av,b);container.append(wrap);scroll();track()}
function panel(text,cls='summary'){container.append($('div',cls,text));scroll()}
function optionPrompt(prompt,opts,fn){controls.replaceChildren($('p','prompt',prompt));const grid=$('div','choices');opts.forEach(o=>{const b=$('button','btn',o);b.type='button';b.addEventListener('click',()=>{controls.replaceChildren();bubble(o,true);fn(o)});grid.append(b)});controls.append(grid)}
function button(label,fn){controls.replaceChildren();const b=$('button','btn primary',label);b.type='button';b.onclick=fn;controls.append(b)}
function cards(){const area=$('div','cards');PRODUCTS.forEach(p=>{const card=$('div','card'),sw=$('div','swatch');sw.style.background=p.color+'28';sw.innerHTML=ART.replaceAll('{color}',p.color);const title=$('strong','',p.name),details=$('p','',`${p.a} · ${p.b} · ${p.c}`),price=$('div','price',p.price);card.append(sw,title,details,price);area.append(card)});container.append(area);scroll()}
function recommendationText(p){return `${p.name} — ${p.a.toLowerCase()}, ${p.b.toLowerCase()}, ${p.c.toLowerCase()}; ${p.price}.`}
function start(){setStep(0);bubble(STUDY==='study1'?'Welcome. You are exploring three fictional headphone brands. Review the options before using the shopping assistant.':'Welcome. You are exploring three fictional reusable water-bottle brands. Review the options before using the shopping assistant.');cards();optionPrompt('Which product initially appeals to you most?',PRODUCTS.map(x=>x.name).concat(['No preference yet']),v=>{state.initial=v;confidence()})}
function confidence(){optionPrompt('How certain are you about that initial impression?',['Not at all certain','Somewhat certain','Very certain'],v=>{state.initialCertainty=v;if(STUDY==='study2')baselineFit(0);else intro()})}
function baselineFit(i){if(i===PRODUCTS.length){intro();return}const p=PRODUCTS[i];optionPrompt(`Before using the assistant, how well does ${p.name} fit the kind of person you see yourself as?`,['1 — Not at all','2','3','4 — Moderately','5','6','7 — Extremely'],v=>{state.baselineFit[p.id]=parseInt(v,10);baselineFit(i+1)})}
const Q=STUDY==='study1'?[{id:'priority',prompt:'Which feature matters most?',options:['Sound quality','Comfort','Battery life']},{id:'context',prompt:'Where will you mainly use the headphones?',options:['Work or study','Travel or commuting','Relaxing at home']},{id:'tradeoff',prompt:'How do you approach trade-offs?',options:['Prioritize my top feature','Balance several features','Avoid major compromises']}]:[{id:'priority',prompt:'What matters most when choosing a water bottle?',options:['Everyday convenience','Personal style','Durability']},{id:'context',prompt:'Where would you use it most?',options:['Work or campus','Fitness or outdoors','Everyday errands']},{id:'tradeoff',prompt:'How do you weigh options?',options:['Prioritize one key feature','Balance several features','Avoid compromises']}];
function intro(){setStep(1);bubble(collaborative?'I can help you work through the options. I’ll keep track of your priorities as we compare them, and you can decide what feels most suitable.':'This assistant compares product information using the preferences you enter. Enter three inputs to generate a recommendation.');ask(0)}
function ask(i){if(i>=Q.length){reflection();return}const q=Q[i],lead=collaborative?[`Let's start with what matters most to you. ${q.prompt}`,`Thinking about ${state.answers[0].toLowerCase()}, let's consider your day-to-day use. ${q.prompt}`,`We have your main priority and where you'll use it. ${q.prompt}`][i]:[`Input 1/3. ${q.prompt}`,`Input 2/3. ${q.prompt}`,`Input 3/3. ${q.prompt}`][i];bubble(lead);optionPrompt(q.prompt,q.options,v=>{state.answers.push(v);ask(i+1)})}
function reflection(){setStep(2);const lead=collaborative?`You said ${state.answers[0].toLowerCase()} matters most and you'd use it for ${state.answers[1].toLowerCase()}. Let's clarify which practical consideration you want to carry into the comparison.`:`Recorded: ${state.answers[0]}; ${state.answers[1]}. Specify an additional comparison consideration.`;bubble(lead);optionPrompt('Which consideration would you emphasize?',STUDY==='study1'?['Ease of daily use','Long-term reliability','Overall experience']:['Ease of daily use','Long-term reliability','How it fits my routine'],v=>{state.elaboration=v;recommend()})}
function recommend(){setStep(3);const p=PRODUCTS.find(x=>x.id===target);bubble(collaborative?`You've weighed ${state.answers[0].toLowerCase()} and ${state.elaboration.toLowerCase()}. One option to consider is ${p.name}. Let's look at the details and alternatives before you decide.`:`Recommendation generated: ${p.name}. Preference inputs have been recorded. Review the specifications and alternatives before deciding.`);
if(STUDY==='study1')panel(sponsor==='yes'?`Advertising disclosure: ${p.name} is promoted through a paid relationship with this shopping service. This commercial relationship may influence the recommendation.`:'Advertising disclosure: No headphone manufacturer has paid this shopping service to promote a product in this recommendation.','flag');
else panel(identityFrame?`Brand information: ${p.identity}. This description reflects the brand's intended lifestyle positioning.`:`Brand information: ${p.name} offers ${p.a.toLowerCase()}, ${p.b.toLowerCase()}, and ${p.c.toLowerCase()}.`,'flag');
bubble(`Recommendation: ${recommendationText(p)}`);cards();
// Matched final conversational turn and identical choice control in both roles.
bubble(collaborative?'We can compare the recommended option with the others. Which comparison matters most as you make your final choice?':'Select the comparison dimension to display before making the final choice.');optionPrompt('Choose a comparison dimension:',STUDY==='study1'?['Sound and comfort','Comfort and battery','Sound and battery']:['Daily convenience','Insulation and capacity','Design and use'],v=>{state.comparison=v;choice()})}
function choice(){setStep(4);bubble(collaborative?'You have the final say. Which option would you choose for yourself? It is also fine to choose none.':'Final selection: choose one option or no product.');optionPrompt('Your simulated product choice:',PRODUCTS.map(x=>x.name).concat(['I would choose none of these']),v=>{state.selected=v;state.accepted=PRODUCTS.find(x=>x.id===target).name===v;panel(`Your selection: ${v}. This is a research simulation. Nothing will be purchased.`);button('Confirm my selection',finish)})}
function finish(){state.completedAt=new Date().toISOString();state.completionCode='HAART-'+Math.random().toString(36).slice(2,10).toUpperCase();setStep(4);controls.replaceChildren();panel('Activity complete. Please continue to the survey questions.');const c=$('p','muted',`Completion code: ${state.completionCode}`);controls.append(c);const copy=$('button','btn','Copy completion code');copy.onclick=()=>navigator.clipboard?.writeText(state.completionCode);controls.append(copy);try{sessionStorage.setItem('haart-last-'+STUDY,JSON.stringify(state))}catch(e){}try{window.parent.postMessage({type:'haart-agent-complete',payload:state},'*')}catch(e){}if(preview){const out=$('details','');out.append($('summary','','Preview: show recorded responses'));const pre=$('pre','');pre.style.whiteSpace='pre-wrap';pre.textContent=JSON.stringify(state,null,2);out.append(pre);controls.append(out)}}
if(!validRole||!validOther||!validTarget){panel('This link needs a valid experimental assignment. Use the condition links in the README to test the agent.','error');return}
meta.textContent=STUDY==='study1'?'Headphone shopping · Research simulation':'Water-bottle shopping · Research simulation';start();
})();
</script></body></html>
